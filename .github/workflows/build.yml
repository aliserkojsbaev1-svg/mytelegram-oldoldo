name: Build MyTelegram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Replace IP
      run: |
        find . -type f -name "*.cpp" -o -name "*.java" -o -name "*.xml" | xargs sed -i 's/192\.168\.1\.100/143.47.183.208/g'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-33 build-tools;33.0.0 ndk;21.4.7075529 cmake;3.22.1'
        
    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyTelegram-APK
        path: TMessagesProj/build/outputs/apk/**/*.apk
