name: Build MyTelegram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
        restore-keys: gradle-${{ runner.os }}-
        
    - name: Replace IP
      run: |
        find . -type f \( -name "*.cpp" -o -name "*.java" -o -name "*.xml" \) -exec sed -i 's/192\.168\.1\.100/143.47.183.208/g' {} \;
        
    - name: Setup Android SDK
      run: |
        mkdir -p $HOME/sdk/cmdline-tools
        cd $HOME/sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        echo "ANDROID_HOME=$HOME/sdk" >> $GITHUB_ENV
        echo "PATH=$PATH:$HOME/sdk/cmdline-tools/latest/bin:$HOME/sdk/platform-tools" >> $GITHUB_ENV
        yes | $HOME/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/sdk --licenses
        $HOME/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/sdk "platform-tools" "platforms;android-33" "build-tools;33.0.0" "ndk;25.1.8937393" "cmake;3.22.1"
        
    - name: Create google-services.json
      run: |
        echo '{"project_info":{"project_number":"123456789","project_id":"mytelegram"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"org.telegram.messenger"}}}]}' > TMessagesProj/google-services.json
        
    - name: Update BuildVars
      run: |
        sed -i 's/public static int APP_ID = .*/public static int APP_ID = 4;/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
        sed -i 's|public static String APP_HASH = .*|public static String APP_HASH = "014b35b6184100b085b0d0572f9b5103";|' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
        
    - name: Create local.properties
      run: |
        echo "sdk.dir=$HOME/sdk" > local.properties
        echo "ndk.dir=$HOME/sdk/ndk/25.1.8937393" >> local.properties
        
    - name: Build APK
      env:
        GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyTelegram-APK
        path: TMessagesProj/build/outputs/apk/debug/*.apk
